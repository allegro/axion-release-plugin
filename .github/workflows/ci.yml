name: Build

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # gradle-version capped by which JDKs it can run on:
        # 7.6/8.0 -> JDK <=19, 8.5/8.13 -> JDK <=21, 9.x -> JDK 17-25(+EA)
        include:
          - gradle-version: "7.6"
            java-version: "17"
          - gradle-version: "8.0"
            java-version: "17"
          - gradle-version: "8.5"
            java-version: "17"
          - gradle-version: "8.5"
            java-version: "21"
          - gradle-version: "8.13"
            java-version: "17"
          - gradle-version: "8.13"
            java-version: "21"
          - gradle-version: "9.6.0"
            java-version: "17"
          - gradle-version: "9.6.0"
            java-version: "21"
          - gradle-version: "9.6.0"
            java-version: "25"
          - gradle-version: "current"
            java-version: "17"
          - gradle-version: "current"
            java-version: "21"
          - gradle-version: "current"
            java-version: "25"
          - gradle-version: "current"
            java-version: "26-ea"

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
            distribution: temurin
            java-version: ${{ matrix.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          dependency-graph: ${{(github.event.repository != null && github.ref_name == github.event.repository.default_branch && matrix.gradle-version == 'current' && matrix.java-version == '17') && 'generate-and-submit' || 'disabled' }}
          gradle-version: ${{ matrix.gradle-version }}

      - name: Test with Gradle
        run: gradle build

      - name: Jacoco
        if: ${{ matrix.gradle-version == 'current' && matrix.java-version == '17' }}
        run: gradle jacocoTestReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ matrix.gradle-version == 'current' && matrix.java-version == '17' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
